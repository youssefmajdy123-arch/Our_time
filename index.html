<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Time ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;overflow-x:hidden;overflow-y:auto;
background:radial-gradient(circle at 50% 0%,#ff8fa3 0,#5b0824 35%,#140009 100%)}
.heart{position:fixed;bottom:-50px;color:#ff91aa;animation:up linear forwards;pointer-events:none;z-index:0}
@keyframes up{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-110vh) rotate(360deg);opacity:0}}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1}
@media(max-width:750px){.page{align-items:flex-start;padding:18px 12px 40px}.card{margin:10px 0 20px}}
.card{width:min(900px,100%);padding:35px 22px;border-radius:30px;text-align:center;
background:rgba(255,255,255,.10);backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.2);box-shadow:0 0 60px rgba(255,40,100,.25)}
.login-card{max-width:430px}
.heart-logo{font-size:75px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.14)}}
h1{margin:10px 0;font-size:34px}
.sub{opacity:.82;margin:10px 0 25px}
input{width:100%;padding:16px;border-radius:16px;border:1px solid rgba(255,255,255,.2);
outline:none;background:rgba(255,255,255,.12);color:#fff;text-align:center;font-size:18px}
input::placeholder{color:#ddd}
button{width:100%;padding:15px;margin-top:14px;border:0;border-radius:16px;
background:linear-gradient(135deg,#ff315d,#ff7895);color:white;font-size:18px;font-weight:bold;cursor:pointer}
#error{display:none;color:#ffd0da;margin-top:14px}
#counterPage{display:none}
.name{font-size:29px;margin:8px 0;color:#ffd0da}
.timer{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:30px}
.unit{padding:22px 8px;border-radius:22px;background:rgba(255,255,255,.10);
border:1px solid rgba(255,255,255,.17)}
.num{font-size:38px;font-weight:bold;text-shadow:0 0 16px #ff4f75}
.label{margin-top:8px;color:#ffc1cf}
.message{font-size:19px;margin:32px 0 5px;line-height:1.7}
.small{font-size:13px;opacity:.65;margin-top:14px}
.logout{width:auto;padding:10px 24px;background:rgba(255,255,255,.12)}
@media(max-width:750px){.timer{grid-template-columns:repeat(2,1fr)}.num{font-size:34px}h1{font-size:29px}}
</style>
</head>
<body>
<div id="hearts"></div>

<section class="page" id="loginPage">
  <div class="card login-card">
    <div class="heart-logo">❤️</div>
    <h1>Our Time</h1>
    <div class="sub">اكتب كلمة السر عشان تدخل ذكريتك ✨</div>
    <input id="password" type="password" placeholder="كلمة السر..." autocomplete="off">
    <button onclick="enterSite()">دخول ❤️</button>
    <div id="error">اكتب اسمك الأول ❤️</div>
  </div>
</section>

<section class="page" id="counterPage">
  <div class="card">
    <h1>❤️ Our Time ❤️</h1>
    <div class="name" id="name"></div>
    <div class="timer">
      <div class="unit"><div class="num" id="years">0</div><div class="label">سنة</div></div>
      <div class="unit"><div class="num" id="months">0</div><div class="label">شهر</div></div>
      <div class="unit"><div class="num" id="days">0</div><div class="label">يوم</div></div>
      <div class="unit"><div class="num" id="hours">0</div><div class="label">ساعة</div></div>
      <div class="unit"><div class="num" id="minutes">0</div><div class="label">دقيقة</div></div>
      <div class="unit"><div class="num" id="seconds">0</div><div class="label">ثانية</div></div>
    </div>
    <div class="message" id="message"></div>
    <div class="small">كل ثانية بتعدّي بتضيف ذكرى ❤️</div>
    <button class="logout" onclick="logout()">خروج</button>
  </div>
</section>

<script>
// كلمة السر ← الاسم والرسالة.
// أضف أي كلمات سر أخرى هنا بنفس الشكل.
// مثال: "GOOO": {name:"جو", message:"..."}
const accounts = {
  "Joo1": {
    name: "جو",
    message: "بصّي، إحنا ممكن نختلف شوية ونعمل نفسنا زعلانين 😂 بس في الآخر مفيش أحلى من إننا نرجع نضحك ونتكلم عادي ❤️ فـ اعتبريها مصالحة صغيرة كده من غير مقدمات ولا زعل 😌😂 ويلا نبدأ صفحة جديدة… بس من غير ما نبوّظها تاني 😂❤️"
  },
  "Miro2": {
    name: "ميرو",
    message: "بصّي، إحنا ممكن نختلف شوية ونعمل نفسنا زعلانين 😂 بس في الآخر مفيش أحلى من إننا نرجع نضحك ونتكلم عادي ❤️ فـ اعتبريها مصالحة صغيرة كده من غير مقدمات ولا زعل 😌😂 ويلا نبدأ صفحة جديدة… بس من غير ما نبوّظها تاني 😂❤️"
  },
  "Doda11": {
    name: "doda",
    message: "بصّي، إحنا ممكن نختلف شوية ونعمل نفسنا زعلانين 😂 بس في الآخر مفيش أحلى من إننا نرجع نضحك ونتكلم عادي ❤️ فـ اعتبريها مصالحة صغيرة كده من غير مقدمات ولا زعل 😌😂 ويلا نبدأ صفحة جديدة… بس من غير ما نبوّظها تاني 😂❤️"
  }
};

let currentKey = null, interval = null;

function createHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.textContent=["❤️","💕","💗","💖","💘","💞"][Math.floor(Math.random()*6)];
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(15+Math.random()*25)+"px";
  h.style.animationDuration=(5+Math.random()*7)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),14000);
}
setInterval(createHeart,650);

function enterSite(){
  const raw=document.getElementById("password").value.trim();
  const error=document.getElementById("error");
  const key=Object.keys(accounts).find(k=>k.toLowerCase()===raw.toLowerCase());

  if(!key){
    error.textContent="كلمة السر غير صحيحة ❤️";
    error.style.display="block";
    return;
  }

  error.style.display="none";
  currentKey=key;

  const storageKey="ourTime_"+key;
  let start=localStorage.getItem(storageKey);

  if(!start){
    start=Date.now();
    localStorage.setItem(storageKey,start);
  }

  document.getElementById("loginPage").style.display="none";
  document.getElementById("counterPage").style.display="flex";
  document.getElementById("name").textContent="إلى "+accounts[key].name+" ❤️";
  document.getElementById("message").textContent=accounts[key].message;

  startTimer(Number(start));
}

function startTimer(start){
  clearInterval(interval);
  updateTimer(start);
  interval=setInterval(()=>updateTimer(start),1000);
}

function updateTimer(startTime){
  const now=new Date(), start=new Date(startTime);
  let y=now.getFullYear()-start.getFullYear();
  let mo=now.getMonth()-start.getMonth();
  let d=now.getDate()-start.getDate();
  let h=now.getHours()-start.getHours();
  let mi=now.getMinutes()-start.getMinutes();
  let s=now.getSeconds()-start.getSeconds();

  if(s<0){s+=60;mi--}
  if(mi<0){mi+=60;h--}
  if(h<0){h+=24;d--}
  if(d<0){
    d+=new Date(now.getFullYear(),now.getMonth(),0).getDate();
    mo--;
  }
  if(mo<0){mo+=12;y--}

  document.getElementById("years").textContent=y;
  document.getElementById("months").textContent=mo;
  document.getElementById("days").textContent=d;
  document.getElementById("hours").textContent=h;
  document.getElementById("minutes").textContent=mi;
  document.getElementById("seconds").textContent=s;
}

function logout(){
  clearInterval(interval);
  document.getElementById("counterPage").style.display="none";
  document.getElementById("loginPage").style.display="flex";
  document.getElementById("password").value="";
}
</script>
</body>
</html>
